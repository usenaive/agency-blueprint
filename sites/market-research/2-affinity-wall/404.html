<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --wall: #f2f3f0; --board: #fbfbf9; --ink: #1d2030; --muted: #4a4e5e; --line: #d9dbd4; --red: #c42a38; --yellow: #ffe46b; --pink: #ffb9cf; --blue: #a9d6ff; --hand: "Shantell Sans", "Comic Sans MS", cursive; --gut: clamp(20px, 4vw, 56px); --ease: cubic-bezier(0.3, 0.9, 0.3, 1.15); --shadow: 0 1px 1px rgb(29 32 48 / 0.08), 0 10px 18px -10px rgb(29 32 48 / 0.35); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--wall); color: var(--ink); font: 400 1.0625rem/1.6 "Albert Sans", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; border-radius: 4px; }
.skip { position: absolute; left: 12px; top: -80px; padding: 10px 14px; background: var(--ink); color: #fff; }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1360px; margin-inline: auto; padding-inline: var(--gut); }
header .wrap { display: flex; align-items: center; min-height: 80px; }
.brand { display: inline-flex; align-items: center; gap: 12px; padding-block: 6px; font: 800 1.125rem/1.2 inherit; font-family: inherit; text-decoration: none; overflow-wrap: anywhere; }
.brand i { flex: none; width: 22px; height: 22px; background: var(--yellow); box-shadow: var(--shadow); transform: rotate(-6deg); transition: transform 0.4s var(--ease); }
main { flex: 1; }
main .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; padding-block: clamp(40px, 8vw, 112px); }
.hand { font-family: var(--hand); }
.kick { color: var(--red); font-size: 1.1875rem; transform: rotate(-1.5deg); transform-origin: 0 50%; }
h1 { margin-top: 16px; font-size: clamp(2.5rem, 1.3rem + 3.6vw, 4.75rem); font-weight: 800; line-height: 1; letter-spacing: -0.035em; }
.lede { margin-top: 22px; color: var(--muted); font-size: 1.1875rem; max-width: 30em; }
.btn { position: relative; display: inline-flex; margin-top: 30px; padding: 14px 26px; border: 2.5px solid var(--ink); border-radius: 999px; font-weight: 700; text-decoration: none; overflow: hidden; isolation: isolate; transition: transform 0.35s var(--ease); }
.btn::before { content: ""; position: absolute; inset: -2px; z-index: -1; background: var(--yellow); transform: translateX(-102%) skewX(-12deg); transition: transform 0.45s ease; }
.board { position: relative; min-height: 380px; background: var(--board); box-shadow: inset 0 0 0 1px var(--line); border-radius: 6px; }
.n { position: absolute; width: 150px; aspect-ratio: 1; display: grid; place-items: center; padding: 12px; text-align: center; font: 600 1.0625rem/1.25 var(--hand); box-shadow: var(--shadow); }
.ghost { left: 40%; top: 30%; border: 2.5px dashed var(--red); box-shadow: none; color: var(--red); transform: rotate(3deg); }
.n1 { left: 8%; top: 12%; background: var(--pink); transform: rotate(-4deg); }
.n2 { right: 7%; bottom: 10%; background: var(--blue); transform: rotate(5deg); }
footer { border-top: 1px solid var(--line); font-size: 0.9375rem; font-weight: 700; }
footer p { padding-block: 24px; overflow-wrap: anywhere; }
@media (hover: hover) { .btn:hover { transform: rotate(-1.5deg); } .btn:hover::before { transform: translateX(0) skewX(-12deg); } .brand:hover i { transform: rotate(8deg) scale(1.1); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 800px) { main .wrap { grid-template-columns: minmax(0, 1fr); } .board { min-height: 320px; } .n { width: 120px; font-size: 0.9375rem; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap"><a class="brand" href="/"><i aria-hidden="true"></i>{{company_name}}</a></div></header>
<main id="main">
  <div class="wrap">
    <div>
      <p class="hand kick">Page not found</p>
      <h1>This note fell off the wall</h1>
      <p class="lede">The page you were after is not here. It may have moved, or the link may have a typo in it.</p>
      <a class="btn" href="/">Back to the wall</a>
    </div>
    <div class="board" aria-hidden="true">
      <p class="n n1">Still here</p>
      <p class="n ghost">Missing page</p>
      <p class="n n2">Also here</p>
    </div>
  </div>
</main>
<footer><div class="wrap"><p>&copy; {{year}} {{company_name}}</p></div></footer>
</body>
</html>
