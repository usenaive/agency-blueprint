<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --ground: #fbfaf6; --raise: #fff; --ink: #1c1c1a; --muted: #5b5a54; --line: #e2dfd6; --link: #1f3fcf; --link-hover: #6a2bb0; --chip: #f1efe8; --ease: cubic-bezier(.2,.7,.2,1); color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --ground: #121315; --raise: #1a1b1e; --ink: #ecebe6; --muted: #a7a6a0; --line: #2d2e33; --link: #9bb3ff; --link-hover: #d1a8ff; --chip: #1e2024; } }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font: 400 17px/1.55 "Arimo", Arial, sans-serif; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; border-radius: 4px; }
.skip { position: absolute; left: 16px; top: -60px; padding: 10px 16px; background: var(--link); color: var(--ground); border-radius: 999px; font-weight: 700; text-decoration: none; }
.skip:focus { top: 12px; }
header { border-bottom: 1px solid var(--line); }
header a { display: inline-flex; align-items: center; gap: 12px; max-width: 1280px; padding: 18px 32px; font-weight: 700; font-size: 19px; text-decoration: none; color: inherit; }
header a i { width: 22px; height: 22px; flex: none; border: 3px solid var(--link); border-radius: 50%; transition: transform .4s var(--ease); }
header a:hover i { transform: rotate(-20deg) scale(1.12); }
main { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: 56px 32px 80px; }
.box { display: flex; align-items: center; gap: 18px; max-width: 920px; min-height: 84px; padding: 16px 32px; border: 1px solid var(--line); background: var(--raise); border-radius: 999px; font-size: clamp(20px, 2.6vw, 34px); color: var(--muted); }
.box svg { width: 30px; height: 30px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.box b { width: 2px; height: 1.1em; background: var(--link); animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.body { padding: 48px 0 0 32px; max-width: 760px; }
h1 { margin: 0 0 18px; font: 500 clamp(34px, 4.6vw, 64px)/1.06 "Gelasio", Georgia, serif; letter-spacing: -.02em; }
p { margin: 0 0 12px; }
ul { margin: 0 0 32px; padding-left: 22px; color: var(--muted); }
.home { display: inline-flex; align-items: center; gap: 14px; min-height: 52px; padding: 12px 22px; border-radius: 999px; background: var(--link); color: var(--raise); font-weight: 700; text-decoration: none; transition: transform .3s var(--ease), background-color .3s; }
.home:hover { transform: translateY(-3px); background: var(--ink); }
footer { border-top: 1px solid var(--line); background: var(--chip); padding: 24px 32px; font-size: 14px; color: var(--muted); }
@media (max-width: 620px) { header a { padding: 14px 16px; } main { padding: 32px 16px 56px; } .box { min-height: 64px; padding: 12px 20px; font-size: 20px; } .body { padding-left: 0; } footer { padding: 20px 16px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><a href="/"><i aria-hidden="true"></i>{{company_name}}</a></header>
<main id="main">
  <div class="box" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><span>this page</span><b></b></div>
  <div class="body">
    <h1>Your search did not match any pages.</h1>
    <p>Suggestions:</p>
    <ul>
      <li>Check the address for a typo.</li>
      <li>The page may have moved when the site was tidied up.</li>
      <li>Start again from the home page.</li>
    </ul>
    <a class="home" href="/">Go to the home page</a>
  </div>
</main>
<footer>&copy; {{year}} {{company_name}}</footer>
</body>
</html>
