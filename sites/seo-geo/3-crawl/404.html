<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>404 | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --paper: #f6f5f0; --ink: #161a33; --blue: #0a56a0; --blue-line: #3f86d4; --pink: #ff3d9a; --pink-soft: #ffd3e7; --muted: #50546a; --ease: cubic-bezier(.25,.8,.25,1); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 500 18px/1.55 "Mona Sans", Arial, sans-serif; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
.skip { position: absolute; left: 16px; top: -60px; padding: 10px 16px; background: var(--ink); color: var(--paper); text-decoration: none; }
.skip:focus { top: 12px; }
header { padding: 22px 40px; }
header a { font-weight: 700; font-size: 19px; text-decoration: none; color: inherit; }
main { flex: 1; width: 100%; max-width: 1360px; margin: 0 auto; padding: 40px 40px 80px; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: 40px 64px; align-items: center; }
.req { display: flex; gap: 10px; align-items: center; font: 400 14px/1.2 "Spline Sans Mono", monospace; color: var(--blue); }
.req b { padding: 4px 7px; background: var(--ink); color: var(--paper); }
.req i { font-style: normal; padding: 4px 8px; border-radius: 999px; background: var(--ink); color: var(--pink-soft); font-weight: 600; }
h1 { margin: 22px 0 22px; font: 800 clamp(44px, 6vw, 96px)/.95 "Mona Sans", Arial, sans-serif; font-stretch: 125%; letter-spacing: -.035em; color: var(--blue); text-shadow: .05em .035em 0 var(--pink-soft); }
p { margin: 0 0 28px; max-width: 52ch; }
.btn { display: inline-flex; align-items: center; gap: 14px; min-height: 56px; padding: 14px 24px; background: var(--ink); color: var(--paper); font-weight: 700; text-decoration: none; box-shadow: 6px 6px 0 var(--pink); transition: transform .3s var(--ease), box-shadow .3s var(--ease); }
.btn:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--pink); }
svg { width: 100%; max-width: 380px; height: auto; }
footer { padding: 24px 40px; font: 400 14px/1.5 "Spline Sans Mono", monospace; color: var(--muted); }
@media (max-width: 760px) { header, footer { padding: 14px 16px; } main { grid-template-columns: minmax(0, 1fr); padding: 24px 16px 56px; } h1 { font-size: 40px; font-stretch: 110%; } svg { max-width: 260px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><a href="/">{{company_name}}</a></header>
<main id="main">
  <div>
    <p class="req"><b>GET</b> this page <i>404</i></p>
    <h1>No page at this address.</h1>
    <p>The crawler followed a link here and found nothing. It may have moved, or the address may have a typo. Every page on this site is one link from the home page.</p>
    <a class="btn" href="/">Back to /</a>
  </div>
  <svg viewBox="0 0 300 300" aria-hidden="true">
    <path d="M150 60v80M150 140l-80 70M150 140l80 70" stroke="#3f86d4" stroke-width="2.5" fill="none"/>
    <path d="M230 210v50" stroke="#3f86d4" stroke-width="2.5" stroke-dasharray="6 7" fill="none"/>
    <circle cx="150" cy="60" r="26" fill="#161a33"/>
    <circle cx="150" cy="140" r="16" fill="#ff3d9a" stroke="#161a33" stroke-width="2.5"/>
    <circle cx="70" cy="210" r="11" fill="#ff3d9a" stroke="#161a33" stroke-width="2.5"/>
    <circle cx="230" cy="210" r="11" fill="#ff3d9a" stroke="#161a33" stroke-width="2.5"/>
    <circle cx="230" cy="272" r="13" fill="none" stroke="#0a56a0" stroke-width="2.5" stroke-dasharray="5 5"/>
  </svg>
</main>
<footer>&copy; {{year}} {{company_name}}</footer>
</body>
</html>
