<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ff7a59">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --coral: #ff7a59; --plum: #2a1650; --lilac: #c9c2ff; --lime: #d4f75b; --gut: clamp(20px, 4vw, 56px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--coral); color: var(--plum); font: 400 1.0625rem/1.6 "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; border-radius: 8px; }
.skip { position: absolute; left: 12px; top: -80px; padding: 12px 16px; background: var(--plum); color: var(--lime); }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1400px; margin-inline: auto; padding-inline: var(--gut); }
header .wrap { display: flex; align-items: center; min-height: 84px; }
.brand { font: 700 1.3125rem/1.15 "Fredoka", sans-serif; overflow-wrap: anywhere; min-width: 0; }
main { flex: 1; display: flex; align-items: center; }
main .wrap { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 48px; align-items: center; padding-block: 48px; }
.k { display: inline-block; padding: 6px 16px; border-radius: 999px; background: var(--plum); color: var(--lime); font: 600 1rem/1.4 "Fredoka", sans-serif; }
h1 { margin-top: 20px; font: 700 clamp(2.75rem, 1.2rem + 4.6vw, 5.5rem)/0.98 "Fredoka", sans-serif; letter-spacing: -0.03em; }
.copy p:not(.k) { margin-top: 22px; max-width: 30em; font-size: 1.1875rem; }
.btn { display: inline-flex; align-items: center; min-height: 52px; margin-top: 32px; padding: 0 26px; border-radius: 999px; background: var(--lime); border: 3px solid var(--plum); box-shadow: 0 6px 0 var(--plum); font: 600 1.0625rem/1 "Fredoka", sans-serif; transition: transform 0.15s, box-shadow 0.15s; }
svg.bot { width: min(100%, 300px); height: auto; justify-self: center; }
footer { background: var(--plum); color: #fff; }
footer p { padding-block: 28px; overflow-wrap: anywhere; }
@media (hover: hover) { .btn:hover { transform: translateY(4px); box-shadow: 0 2px 0 var(--plum); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 760px) { main .wrap { grid-template-columns: 1fr; } svg.bot { width: 200px; justify-self: start; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap"><a class="brand" href="/">{{company_name}}</a></div></header>
<main id="main">
  <div class="wrap">
    <div class="copy">
      <p class="k">Page not found</p>
      <h1>We tapped here and nothing happened</h1>
      <p>This page does not exist. That is a dead end, and dead ends are exactly what we hunt for. Let us get you back.</p>
      <a class="btn" href="/">Back to the home page</a>
    </div>
    <svg class="bot" viewBox="0 0 200 230" aria-hidden="true">
      <path d="M100 42V18" stroke="#2a1650" stroke-width="6" stroke-linecap="round"/>
      <circle cx="100" cy="14" r="10" fill="#d4f75b" stroke="#2a1650" stroke-width="4"/>
      <rect x="26" y="42" width="148" height="112" rx="44" fill="#2a1650"/>
      <rect x="46" y="62" width="108" height="70" rx="26" fill="#c9c2ff"/>
      <path d="M70 88l16 12M86 88l-16 12M114 88l16 12M130 88l-16 12" stroke="#2a1650" stroke-width="5" stroke-linecap="round"/>
      <path d="M90 120q10-7 20 0" fill="none" stroke="#2a1650" stroke-width="5" stroke-linecap="round"/>
      <rect x="62" y="160" width="76" height="58" rx="24" fill="#2a1650"/>
      <circle cx="100" cy="189" r="9" fill="#d4f75b"/>
    </svg>
  </div>
</main>
<footer><div class="wrap"><p>&copy; {{year}} {{company_name}}</p></div></footer>
</body>
</html>
