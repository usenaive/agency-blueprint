<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --ground: #eceed6; --grid: rgb(70 120 84 / 0.14); --grid2: rgb(70 120 84 / 0.28); --ink: #1b2340; --muted: #454e68; --red: #b92a22; --card: #fbfbf4; --rule: #bccde6; --hl: #ffc0d3; --mx: clamp(132px, 12vw, 180px); --gut: clamp(20px, 4vw, 56px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; color: var(--ink); font: 500 1.125rem/1.55 "Spectral", Georgia, serif; background-color: var(--ground); background-image: linear-gradient(var(--grid2) 1px, transparent 1px), linear-gradient(90deg, var(--grid2) 1px, transparent 1px), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
h1, p { margin: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px dashed var(--red); outline-offset: 4px; }
.t { font: 400 1rem/1.6 "Courier Prime", "Courier New", monospace; }
.skip { position: absolute; left: 12px; top: -80px; padding: 12px 16px; background: var(--ink); color: var(--card); }
.skip:focus { top: 12px; }
.sheet { position: relative; width: 100%; max-width: 1440px; margin-inline: auto; padding-left: calc(var(--mx) + 32px); padding-right: var(--gut); }
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: var(--mx); width: 2px; background: var(--red); opacity: 0.75; }
header { border-bottom: 2px solid var(--ink); }
header .sheet { display: flex; align-items: center; min-height: 76px; }
.brand { font: italic 500 1.375rem/1.15 "Spectral", serif; overflow-wrap: anywhere; min-width: 0; }
main { flex: 1; display: flex; align-items: center; }
main .sheet { padding-block: 64px; }
.m { position: absolute; left: var(--gut); width: calc(var(--mx) - var(--gut) - 16px); text-align: right; color: var(--red); font: 700 0.8125rem/1.3 "Courier Prime", monospace; top: 72px; }
.k { color: var(--red); font-weight: 700; }
h1 { margin-top: 12px; font: 500 clamp(2.5rem, 1.2rem + 3.8vw, 5rem)/1.02 "Spectral", serif; letter-spacing: -0.03em; }
.card { max-width: 560px; margin-top: 32px; background: var(--card) repeating-linear-gradient(transparent 0 35px, var(--rule) 35px 36px); padding: 0 22px 6px; transform: rotate(-0.8deg); box-shadow: 0 18px 30px -18px rgb(27 35 64 / 0.4); }
.card p { display: grid; grid-template-columns: 56px 1fr; gap: 12px; min-height: 36px; padding-top: 6px; }
.card p span:first-child { color: var(--red); }
.btn { display: inline-flex; gap: 4px; align-items: center; min-height: 48px; margin-top: 36px; padding: 0 14px; border: 2px solid var(--ink); background: var(--ink); color: var(--card); font: 700 1rem/1 "Courier Prime", monospace; transition: transform 0.3s, box-shadow 0.3s; }
.btn b { color: var(--hl); transition: transform 0.3s; }
footer { border-top: 2px solid var(--ink); }
footer p { padding-block: 24px; overflow-wrap: anywhere; }
@media (hover: hover) { .btn:hover { transform: translate(-3px, -3px); box-shadow: 3px 3px 0 var(--red); } .btn:hover b:first-child { transform: translateX(-5px); } .btn:hover b:last-child { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 760px) { :root { --mx: 22px; --gut: 18px; } .sheet { padding-left: 40px; } .m { position: static; text-align: left; } .card { transform: none; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="sheet"><a class="brand" href="/">{{company_name}}</a></div></header>
<main id="main">
  <div class="sheet">
    <p class="m" aria-hidden="true">Loose page</p>
    <p class="t k">Page not found</p>
    <h1>This page was never written</h1>
    <div class="card t" aria-hidden="true">
      <p><span>00:01</span><span>Followed a link to this address</span></p>
      <p><span>00:02</span><span>Expected a page. Found a blank sheet.</span></p>
      <p><span>00:03</span><span>Logged it. Heading back.</span></p>
    </div>
    <a class="btn" href="/"><b aria-hidden="true">[</b>Back to the home page<b aria-hidden="true">]</b></a>
  </div>
</main>
<footer><div class="sheet t"><p>&copy; {{year}} {{company_name}}</p></div></footer>
</body>
</html>
