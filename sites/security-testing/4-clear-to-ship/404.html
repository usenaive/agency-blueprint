<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f3d3a">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --pine: #0f3d3a; --pine-2: #144a46; --on-pine: #eef3f1; --pine-muted: #b5cac5; --pine-line: #2c5e59; --brass: #d9b26a; --gut: clamp(20px, 4.5vw, 72px); --calm: cubic-bezier(0.22, 0.61, 0.36, 1); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--pine); color: var(--on-pine); font: 400 1.0625rem/1.65 "Public Sans", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
.skip { position: absolute; left: 12px; top: -80px; padding: 12px 16px; background: var(--brass); color: var(--pine); }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1360px; margin-inline: auto; padding-inline: var(--gut); }
header .wrap { display: flex; align-items: center; min-height: 84px; border-bottom: 1px solid var(--pine-line); }
.brand { display: inline-flex; align-items: center; gap: 12px; font: 600 1.1875rem/1.2 "Source Serif 4", Georgia, serif; overflow-wrap: anywhere; min-width: 0; }
.brand svg { flex: none; width: 28px; height: 20px; }
main { flex: 1; display: flex; align-items: center; }
main .wrap { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 64px; align-items: center; padding-block: 72px; }
.k { color: var(--pine-muted); font-size: 0.9375rem; }
h1 { margin-top: 18px; font: 400 clamp(2.5rem, 1.2rem + 3.6vw, 4.5rem)/1.06 "Source Serif 4", Georgia, serif; letter-spacing: -0.02em; }
.copy p:not(.k) { margin-top: 22px; max-width: 32em; color: var(--pine-muted); font-size: 1.125rem; }
.btn { position: relative; display: inline-flex; align-items: center; gap: 10px; min-height: 50px; margin-top: 36px; padding: 0 24px; border-radius: 2px; background: var(--brass); color: var(--pine); font-weight: 600; overflow: hidden; isolation: isolate; }
.btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--on-pine); transform: translateY(101%); transition: transform 0.5s var(--calm); }
.btn::after { content: ""; width: 14px; height: 1px; background: currentColor; transition: width 0.5s var(--calm); }
.scene { position: relative; height: 170px; border: 1px solid var(--pine-line); background: var(--pine-2); }
.scene i { position: absolute; display: block; }
.track { left: 24px; right: 24px; bottom: 36px; border-top: 2px dashed var(--pine-line); }
.post { left: 60%; bottom: 36px; width: 14px; height: 84px; margin-left: -7px; border-radius: 3px 3px 0 0; background: var(--on-pine); }
.boom { right: 40%; bottom: 104px; width: 48%; height: 12px; border-radius: 6px; background: repeating-linear-gradient(90deg, var(--on-pine) 0 22px, var(--brass) 22px 44px); }
.light { left: 60%; bottom: 128px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--brass); }
.cap { position: absolute; left: 24px; bottom: 6px; font-size: 0.875rem; color: var(--pine-muted); font-style: normal; }
footer { border-top: 1px solid var(--pine-line); color: var(--pine-muted); font-size: 0.9375rem; }
footer p { padding-block: 26px; overflow-wrap: anywhere; }
@media (hover: hover) { .btn:hover::before { transform: translateY(0); } .btn:hover::after { width: 28px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 860px) { main .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap"><a class="brand" href="/"><svg viewBox="0 0 28 20" aria-hidden="true"><rect x="1" y="6" width="4" height="13" rx="1" fill="#eef3f1"/><rect x="3" y="6" width="24" height="3.5" rx="1.75" fill="#d9b26a"/></svg>{{company_name}}</a></div></header>
<main id="main">
  <div class="wrap">
    <div class="copy">
      <p class="k">Page not found</p>
      <h1>This page is not cleared for release</h1>
      <p>There is nothing at this address. Everything else on the site is checked and open.</p>
      <a class="btn" href="/">Back to the home page</a>
    </div>
    <div class="scene" aria-hidden="true"><i class="track"></i><i class="post"></i><i class="light"></i><i class="boom"></i><i class="cap">Holding: no page found</i></div>
  </div>
</main>
<footer><div class="wrap"><p>&copy; {{year}} {{company_name}}</p></div></footer>
</body>
</html>
