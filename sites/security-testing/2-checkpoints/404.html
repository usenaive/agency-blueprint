<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --ground: #e6eedf; --paper: #f6f9f2; --ink: #12261c; --muted: #3f5347; --line: #c3d1bb; --route: #e2481d; --route-ink: #b23610; --gut: clamp(20px, 4vw, 56px); --hop: cubic-bezier(0.34, 1.5, 0.6, 1); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font: 400 1.0625rem/1.6 "Figtree", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--route-ink); outline-offset: 3px; border-radius: 4px; }
.skip { position: absolute; left: 12px; top: -80px; padding: 12px 16px; background: var(--ink); color: var(--ground); }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: var(--gut); }
header .wrap { display: flex; align-items: center; min-height: 84px; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; font: 700 1rem/1.2 "Unbounded", sans-serif; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.brand svg { flex: none; width: 20px; height: 24px; transition: transform 0.45s var(--hop); }
main { flex: 1; display: flex; align-items: center; }
.card { position: relative; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 48px; align-items: center; padding: clamp(28px, 5vw, 64px); border-radius: 28px; background: repeating-radial-gradient(circle at 80% 120%, transparent 0 46px, rgb(18 38 28 / 0.07) 46px 47px), var(--paper); }
.k { font-weight: 600; font-size: 0.9375rem; color: var(--route-ink); }
h1 { margin-top: 12px; font: 700 clamp(2.25rem, 1rem + 3.6vw, 4.25rem)/1.04 "Unbounded", sans-serif; letter-spacing: -0.045em; }
.copy p:not(.k) { margin-top: 18px; max-width: 30em; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 50px; margin-top: 28px; padding: 0 22px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 600; transition: transform 0.35s var(--hop); }
.btn::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--route); }
.off { display: grid; justify-items: center; gap: 10px; text-align: center; color: var(--muted); }
.off svg { width: min(100%, 320px); height: auto; }
footer { background: var(--ink); color: var(--ground); }
footer p { padding-block: 26px; overflow-wrap: anywhere; }
@media (hover: hover) { .btn:hover { transform: translateY(-3px); } .brand:hover svg { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 820px) { .card { grid-template-columns: 1fr; } main .wrap { padding-block: 24px; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap"><a class="brand" href="/"><svg viewBox="0 0 20 24" aria-hidden="true"><path d="M10 23s8-7.6 8-13.5A8 8 0 0 0 2 9.5C2 15.4 10 23 10 23Z" fill="#e2481d"/><circle cx="10" cy="9.5" r="3" fill="#f6f9f2"/></svg>{{company_name}}</a></div></header>
<main id="main">
  <div class="wrap">
    <div class="card">
      <div class="copy">
        <p class="k">Page not found</p>
        <h1>You have wandered off the route</h1>
        <p>There is no page at this address. That is exactly the kind of dead end we look for. The way back is one step.</p>
        <a class="btn" href="/">Back to the start</a>
      </div>
      <div class="off" aria-hidden="true">
        <svg viewBox="0 0 320 180"><path d="M20 150C90 150 80 60 160 60" fill="none" stroke="#e2481d" stroke-width="4" stroke-linecap="round"/><path d="M160 60c60 0 70 70 140 70" fill="none" stroke="#12261c" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.55"/><circle cx="20" cy="150" r="14" fill="#12261c"/><circle cx="160" cy="60" r="24" fill="#e2481d"/><text x="160" y="67" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="700" font-size="20" fill="#fff">?</text><circle cx="300" cy="130" r="18" fill="#f6f9f2" stroke="#12261c" stroke-width="2"/></svg>
        <span>No checkpoint at this address</span>
      </div>
    </div>
  </div>
</main>
<footer><div class="wrap"><p>&copy; {{year}} {{company_name}}</p></div></footer>
</body>
</html>
