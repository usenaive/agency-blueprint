<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --blue: #2b2bf0; --yellow: #ffe14d; --gut: clamp(16px, 3.4vw, 56px); --snap: cubic-bezier(0.7, 0, 0.2, 1); }
@media (prefers-color-scheme: dark) { :root { --blue: #2323c9; } }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--blue); color: #fff; font: 400 1.0625rem/1.55 "Rethink Sans", Arial, sans-serif; overflow-x: hidden; }
h1, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
.skip { position: absolute; left: 12px; top: -80px; padding: 10px 14px; background: var(--yellow); color: #0d0d0f; }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1480px; margin-inline: auto; padding-inline: var(--gut); }
header { padding-block: 20px; }
.brand { font: 800 1.375rem/1 "Anybody", Impact, sans-serif; font-stretch: 120%; text-transform: uppercase; text-decoration: none; overflow-wrap: anywhere; transition: font-stretch 0.4s var(--snap); }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: clamp(32px, 6vw, 96px); overflow: hidden; }
.k { color: var(--yellow); font-weight: 600; }
h1 { margin-top: 14px; font: 900 clamp(3.4rem, 0.6rem + 13vw, 15rem)/0.8 "Anybody", Impact, sans-serif; text-transform: uppercase; }
h1 span { display: block; font-stretch: 50%; }
h1 span + span { font-stretch: 150%; color: transparent; -webkit-text-stroke: 2px #fff; white-space: nowrap; }
.lede { margin-top: 28px; max-width: 30em; font-size: 1.125rem; }
.cta { display: inline-block; margin-top: 28px; padding: 14px 22px; background: var(--yellow); color: #0d0d0f; border-radius: 999px; font-weight: 700; text-decoration: none; transition: transform 0.35s cubic-bezier(0.34, 1.5, 0.6, 1); }
footer { padding-block: 22px 36px; border-top: 2px solid #fff; font-weight: 600; overflow-wrap: anywhere; }
@media (hover: hover) { .cta:hover { transform: translateY(-3px) scale(1.04); } .brand:hover { font-stretch: 150%; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="wrap"><a class="brand" href="/">{{company_name}}</a></header>
<main id="main" class="wrap">
  <p class="k">Error 404</p>
  <h1><span>Page</span> <span>not found</span></h1>
  <p class="lede">Nothing here to stretch. The link may be old, or the page may have moved.</p>
  <p><a class="cta" href="/">Back to the home page</a></p>
</main>
<footer class="wrap"><p>&copy; {{year}} {{company_name}}</p></footer>
</body>
</html>
