<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --stone: #e7e5df; --ink: #161616; --muted: #55534e; --line: #c4c1b8; --green: #0b7556; --onGreen: #fff; --gut: clamp(16px, 4vw, 56px); --gap: clamp(12px, 1.6vw, 24px); --settle: cubic-bezier(0.65, 0, 0.2, 1); }
@media (prefers-color-scheme: dark) { :root { --stone: #121312; --ink: #e8e7e2; --muted: #a3a29c; --line: #343633; --green: #3fcf9e; --onGreen: #0b1a14; } }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--stone); color: var(--ink); font: 400 1.0625rem/1.55 "Hanken Grotesk", Helvetica, Arial, sans-serif; overflow-x: hidden; }
h1, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
.skip { position: absolute; left: 12px; top: -80px; padding: 10px 14px; background: var(--ink); color: var(--stone); }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: var(--gut); }
header { padding-block: 22px; border-bottom: 1px solid var(--ink); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.brand i { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--green); transition: transform 0.5s var(--settle); }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--gap); align-items: end; padding-block: clamp(48px, 8vw, 120px); }
.k { color: var(--muted); font-size: 0.9375rem; }
h1 { margin-top: 20px; font-weight: 500; font-size: clamp(2.5rem, 1.1rem + 4.6vw, 5.75rem); line-height: 0.98; letter-spacing: -0.04em; }
.lede { margin-top: 24px; max-width: 30em; }
.cta { display: inline-flex; align-items: center; gap: 14px; margin-top: 32px; padding: 14px 20px 14px 22px; background: var(--ink); color: var(--stone); font-weight: 500; text-decoration: none; transition: gap 0.45s var(--settle), background-color 0.4s; }
.cta i { width: 14px; height: 14px; border-radius: 50%; background: var(--green); }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.board span { aspect-ratio: 1; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.board span:nth-child(5) { position: relative; border: 1px dashed var(--green); }
.board span:nth-child(5)::after { content: ""; position: absolute; right: 14px; top: 14px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--green); }
footer { padding-block: 24px 40px; border-top: 1px solid var(--ink); font-size: 0.9375rem; overflow-wrap: anywhere; }
@media (hover: hover) { .cta:hover { gap: 22px; background: var(--green); color: var(--onGreen); } .brand:hover i { transform: translateX(4px) scale(1.25); } }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } .board { max-width: 280px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="wrap"><a class="brand" href="/"><i aria-hidden="true"></i>{{company_name}}</a></header>
<main id="main" class="wrap">
  <div>
    <p class="k">Error 404</p>
    <h1>Nothing sits in this module</h1>
    <p class="lede">The page you asked for is not on our grid. The link may be old, or the page may have moved.</p>
    <a class="cta" href="/"><span>Back to the home page</span><i aria-hidden="true"></i></a>
  </div>
  <div class="board" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
</main>
<footer class="wrap"><p>&copy; {{year}} {{company_name}}</p></footer>
</body>
</html>
