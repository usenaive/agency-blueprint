{{#if form_action}}<form class="vf" action="{{form_action}}" method="post" aria-label="Send us a message">
<style>
.vf{display:inline-grid;vertical-align:top;gap:12px;width:100%;max-width:34rem;margin:32px 0 0;font:inherit;color:inherit;text-align:left;position:relative}
.vf label{display:grid;gap:4px;font-size:.875em}
.vf input,.vf textarea{box-sizing:border-box;width:100%;font:inherit;font-size:1rem;color:inherit;background:transparent;border:1px solid currentColor;border-radius:4px;padding:10px 12px}
.vf textarea{min-height:7em;resize:vertical}
.vf button{justify-self:start;font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:4px;padding:10px 20px;cursor:pointer}
.vf :focus-visible{outline:2px solid currentColor;outline-offset:2px}
.vf__note{display:none;margin:0}
.vf__note:target{display:block}
.vf__trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
</style>
<p class="vf__note" id="contact-sent" role="status" tabindex="-1">Thanks, your message is in. We reply by email.</p>
<p class="vf__note" id="contact-failed" role="alert" tabindex="-1">That didn't go through. Please try again{{#if contact_email}} or email <a href="mailto:{{contact_email}}">{{contact_email}}</a>{{/if}}.</p>
<label>Name<input name="name" autocomplete="name" required maxlength="200"></label>
<label>Email<input name="email" type="email" autocomplete="email" required maxlength="320"></label>
<label>Company (optional)<input name="company" autocomplete="organization" maxlength="200"></label>
<label>Message<textarea name="note" required maxlength="4000"></textarea></label>
<div class="vf__trap" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
<button type="submit">Send message</button>
</form>{{/if}}
