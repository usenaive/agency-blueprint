<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root {
  --ground: #f6f7f9; --surface: #fff; --ink: #0f1a2b; --muted: #3e4a5c; --line: #d6dbe3; --wire: #9aa4b2; --accent: #2348ff; --on-accent: #fff;
  --sx: 40px; --pl: 96px; --pr: 56px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}
@media (prefers-color-scheme: dark) {
  :root { --ground: #0b111c; --surface: #111a28; --ink: #e6ebf2; --muted: #adb8c8; --line: #223044; --wire: #4f5d75; --accent: #7f95ff; --on-accent: #0b111c; }
}
@media (max-width: 760px) { :root { --sx: 18px; --pl: 42px; --pr: 20px; } }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font: 400 1.0625rem/1.55 "Instrument Sans", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 0.8125rem; }
.skip { position: absolute; left: 12px; top: -80px; padding: 12px 16px; background: var(--ink); color: var(--ground); }
.skip:focus { top: 12px; }
.page { position: relative; width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: var(--pl) var(--pr); }
.page::before { content: ""; position: absolute; left: var(--sx); top: 0; bottom: 0; width: 1px; background: var(--wire); }
header .page::before { top: 40px; }
.top { display: flex; align-items: center; padding-block: 18px; min-height: 80px; }
.brand { position: relative; padding-block: 8px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.brand::before { content: ""; position: absolute; top: calc(8px + 0.625em); height: 1px; background: var(--wire); left: calc(var(--sx) - var(--pl)); width: calc(var(--pl) - var(--sx) - 14px); transition: transform 0.4s var(--ease); transform-origin: left; }
.node { position: absolute; left: calc(var(--sx) - var(--pl) - 5px); top: calc(8px + 0.625em - 5.5px); width: 11px; height: 11px; background: var(--ink); transition: transform 0.45s cubic-bezier(0.3, 1.45, 0.5, 1), background-color 0.2s; }
main { flex: 1; display: flex; }
main .page { flex: 1; padding-block: 72px 120px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; align-items: center; }
.copy { grid-column: 1 / span 6; }
.copy .mono { color: var(--muted); }
h1 { margin-top: 20px; font-size: clamp(2.5rem, 1rem + 4.3vw, 5.25rem); font-weight: 500; font-stretch: 92%; line-height: 1.02; letter-spacing: -0.035em; }
.copy p:not(.mono) { margin-top: 24px; max-width: 30em; font-size: 1.125rem; }
.btn { position: relative; isolation: isolate; overflow: hidden; display: inline-flex; align-items: center; gap: 12px; min-height: 48px; margin-top: 32px; padding: 0 20px; background: var(--ink); color: var(--ground); font-weight: 500; font-size: 0.9375rem; }
.btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 0.45s var(--ease); }
.btn svg { width: 20px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.25; transform: rotate(180deg); transition: transform 0.4s var(--ease); }
.btn:focus-visible::before { transform: scaleX(1); }
.btn:focus-visible { color: var(--on-accent); }
.chart { grid-column: 8 / -1; display: flex; flex-direction: column; align-items: center; }
.root { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border: 1px solid var(--ink); background: var(--surface); }
.root i { width: 8px; height: 8px; background: var(--accent); }
.trunk { width: 1px; height: 40px; background: var(--wire); }
.seat { width: min(100%, 260px); min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px 16px; border: 1px dashed var(--muted); color: var(--muted); }
.seat span:first-child { display: flex; align-items: center; gap: 8px; font-size: 0.6875rem; }
.seat span:first-child i { width: 8px; height: 8px; border: 1px solid var(--muted); }
.seat b { font-weight: 500; font-size: 1.0625rem; }
footer { border-top: 1px solid var(--line); }
footer .page::before { display: none; }
footer p { padding-block: 20px 28px; font-size: 0.875rem; color: var(--muted); overflow-wrap: anywhere; }
@media (hover: hover) {
  .brand:hover .node { background: var(--accent); transform: scale(1.3); }
  .brand:hover::before { transform: scaleX(0.6); }
  .btn:hover::before { transform: scaleX(1); }
  .btn:hover { color: var(--on-accent); }
  .btn:hover svg { transform: rotate(180deg) translateX(4px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } .btn svg { transform: rotate(180deg) !important; } }
@media (max-width: 1080px) { .copy, .chart { grid-column: 1 / -1; } .chart { margin-top: 56px; align-items: flex-start; } }
@media (max-width: 760px) { main .page { flex: 1; padding-block: 40px 80px; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="page top"><a class="brand" href="/"><span class="node" aria-hidden="true"></span>{{company_name}}</a></div></header>
<main id="main">
  <div class="page">
    <div class="copy">
      <p class="mono">Page not found</p>
      <h1>This seat is empty</h1>
      <p>The page you asked for is not on our chart. The rest of the structure is still in place.</p>
      <a class="btn" href="/"><svg viewBox="0 0 20 10" aria-hidden="true"><path d="M0 5h18M14 1l4 4-4 4"/></svg>Back to the home page</a>
    </div>
    <div class="chart" aria-hidden="true">
      <div class="root"><i></i><span class="mono">Your company</span></div>
      <div class="trunk"></div>
      <div class="seat"><span class="mono"><i></i>Open</span><b>This page</b></div>
    </div>
  </div>
</main>
<footer><div class="page"><p>&copy; {{year}} {{company_name}}</p></div></footer>
</body>
</html>
