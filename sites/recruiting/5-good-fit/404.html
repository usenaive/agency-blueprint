* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #ffffff; color: var(--ink); font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; font-size: 1.125rem; line-height: 1.5; }

header { padding: 20px var(--gut); }
.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.3rem; letter-spacing: -.02em; line-height: 1.05; text-decoration: none; overflow-wrap: anywhere; transition: transform .45s var(--snap); }
.brand svg { width: 42px; flex: none; overflow: visible; }
.brand path { stroke: var(--ink); stroke-width: 7; stroke-linejoin: round; }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 40px 64px; align-items: center; padding: clamp(32px, 6vw, 96px) var(--gut); max-width: 1360px; width: 100%; margin: 0 auto; }
h1 { font-size: clamp(2.6rem, 1rem + 5.4vw, 5.6rem); font-weight: 800; letter-spacing: -.035em; line-height: .95; text-wrap: balance; }
main p { margin-top: 24px; max-width: 30rem; color: var(--muted); }
.btn { display: inline-flex; align-items: center; min-height: 52px; margin-top: 32px; padding: 12px 24px; border: 3px solid var(--ink); border-radius: 14px; background: var(--sun); font-weight: 800; text-decoration: none; box-shadow: 5px 5px 0 var(--ink); transition: transform .4s var(--snap), box-shadow .4s var(--snap); }
.btn:active, .btn:focus-visible { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--ink); }
@media (hover: hover) { .btn:hover { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--ink); } .brand:hover { transform: translateY(-2px) rotate(-1deg); } }
.empty { width: min(100%, 480px); justify-self: center; overflow: visible; }
.empty .role { fill: var(--pink); stroke: var(--ink); stroke-width: 3px; vector-effect: non-scaling-stroke; filter: drop-shadow(6px 6px 0 var(--ink)); }
.empty .slot { fill: none; stroke: var(--ink); stroke-width: 3px; stroke-dasharray: 10 9; vector-effect: non-scaling-stroke; }
.empty text { font: 800 11px "Bricolage Grotesque", sans-serif; fill: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .empty .role { animation: look 4s ease-in-out infinite; transform-origin: 50px 50px; } }
@keyframes look { 0%, 100% { transform: none; } 40% { transform: translateX(8px) rotate(2deg); } 55% { transform: translateX(3px); } }
footer { background: var(--ink); color: #d6d6d6; padding: 26px var(--gut) 32px; font-size: .95rem; }
@media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } .empty { order: -1; width: min(100%, 340px); } }
</style>
