<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --wall: #cdc7bc; --wallDark: #b9b2a5; --ink: #121110; --paper: #f6f1e4; --yellow: #ffe500; --pink: #ff4fae; --gut: clamp(16px, 3.5vw, 56px); --squash: cubic-bezier(0.3, 1.4, 0.5, 1); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--wall); color: var(--ink); font: 500 1.0625rem/1.5 "Work Sans", "Helvetica Neue", Arial, sans-serif; overflow-x: hidden; }
h1, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; box-shadow: 0 0 0 6px var(--yellow); }
.skip { position: absolute; left: 12px; top: -80px; padding: 10px 14px; background: var(--ink); color: var(--yellow); }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: var(--gut); }
.d { font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase; }
header { padding-block: 22px; }
.brand { display: inline-block; padding: 8px 14px; background: var(--ink); color: var(--paper); font-size: 1.375rem; text-decoration: none; transform: rotate(-1deg); overflow-wrap: anywhere; transition: transform 0.35s var(--squash); }
main { flex: 1; display: grid; place-items: center; padding-block: clamp(24px, 5vw, 72px); }
.scrap { position: relative; max-width: 820px; padding: clamp(28px, 5vw, 64px); background: var(--yellow); transform: rotate(-2deg); box-shadow: 4px 12px 22px -10px rgb(0 0 0 / 0.5);
  clip-path: polygon(0 4%, 9% 0, 22% 3%, 38% 0, 55% 2%, 70% 0, 86% 3%, 100% 0, 100% 100%, 0 100%); }
.scrap::after { content: ""; position: absolute; right: 0; bottom: 0; width: 38%; height: 46%; background: var(--wall); clip-path: polygon(100% 0, 100% 100%, 0 100%, 30% 70%, 20% 55%, 60% 40%, 55% 20%); }
.k { font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.9375rem; }
h1 { margin-top: 14px; font-size: clamp(3rem, 1rem + 7vw, 7.5rem); line-height: 0.88; overflow-wrap: anywhere; }
.lede { position: relative; z-index: 1; margin-top: 22px; max-width: 26em; }
.btn { position: relative; z-index: 1; display: inline-block; margin-top: 28px; padding: 16px 22px; background: var(--ink); color: var(--yellow); font-size: 1.375rem; text-decoration: none; box-shadow: 5px 5px 0 var(--pink); transition: transform 0.3s var(--squash), box-shadow 0.3s; }
footer { padding-block: 28px; font-weight: 700; }
footer p { overflow-wrap: anywhere; }
@media (hover: hover) { .btn:hover { transform: translate(-2px, -2px) rotate(-1deg); box-shadow: 8px 8px 0 var(--pink); } .brand:hover { transform: rotate(1deg) scale(1.03); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="wrap"><a class="brand d" href="/">{{company_name}}</a></header>
<main id="main" class="wrap">
  <div class="scrap">
    <p class="k">Error 404</p>
    <h1 class="d">This poster got torn down</h1>
    <p class="lede">The page you were after is not on the wall any more. The link may be old, or the page may have moved.</p>
    <a class="btn d" href="/">Back to the wall</a>
  </div>
</main>
<footer class="wrap"><p>&copy; {{year}} {{company_name}}</p></footer>
</body>
</html>
