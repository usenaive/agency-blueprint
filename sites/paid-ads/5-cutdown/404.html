<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --bg: #121216; --panel: #1a1a20; --panel2: #22222a; --line: #2f2f39; --ink: #ededf2; --muted: #a3a3b1; --r: #ff4d5e; --v: #8b7bff; --t: #3fd0b5; --gut: clamp(16px, 3vw, 48px); --ease: cubic-bezier(0.2, 0.8, 0.2, 1); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.6 "Red Hat Display", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid #ffb648; outline-offset: 3px; }
.skip { position: absolute; left: 12px; top: -80px; padding: 10px 14px; background: var(--ink); color: var(--bg); }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: var(--gut); }
.mono { font: 400 0.8125rem/1.45 "Red Hat Mono", ui-monospace, monospace; color: var(--muted); }
header { background: var(--panel); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; min-height: 64px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.125rem; text-decoration: none; overflow-wrap: anywhere; }
.brand i { flex: none; width: 11px; height: 11px; border-radius: 50%; background: var(--r); transition: transform 0.4s var(--ease); }
main { flex: 1; display: grid; align-content: center; gap: 40px; padding-block: clamp(40px, 6vw, 96px); }
h1 { margin-top: 14px; max-width: 11em; font-weight: 900; font-size: clamp(2.75rem, 0.6rem + 6vw, 7rem); line-height: 0.92; letter-spacing: -0.045em; }
.lede { margin-top: 22px; max-width: 30em; color: var(--muted); font-size: 1.1875rem; }
.btn { display: inline-flex; gap: 14px; margin-top: 28px; padding: 14px 22px; border-radius: 8px; background: var(--r); color: #160307; font-weight: 800; text-decoration: none; transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease); }
.btn b { transition: transform 0.3s var(--ease); }
.tl { display: grid; grid-template-columns: 56px 1fr; gap: 6px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.tl span { display: grid; place-items: center; border-radius: 6px; background: var(--panel2); }
.gap { position: relative; display: flex; gap: 2px; min-height: 60px; }
.gap b { flex: 1; border-radius: 6px; background: var(--v); }
.gap b:last-child { background: var(--t); }
.gap em { flex: 2; display: grid; place-items: center; border: 1px dashed var(--muted); border-radius: 6px; font-style: normal; }
footer { background: var(--panel); border-top: 1px solid var(--line); }
footer p { padding-block: 22px; font-weight: 600; font-size: 0.9375rem; overflow-wrap: anywhere; }
@media (hover: hover) { .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 -3px var(--ink); } .btn:hover b { transform: translateX(4px); } .brand:hover i { transform: scale(1.4); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap"><a class="brand" href="/"><i aria-hidden="true"></i>{{company_name}}</a></div></header>
<main id="main" class="wrap">
  <div>
    <p class="mono">Error 404 · Media offline</p>
    <h1>This clip is missing from the edit</h1>
    <p class="lede">The page was cut, or the link points somewhere it never was. The full edit is on the home page.</p>
    <a class="btn" href="/"><span>Back to the home page</span><b aria-hidden="true">→</b></a>
  </div>
  <div class="tl" aria-hidden="true"><span class="mono">V1</span><div class="gap"><b></b><em class="mono">Media offline</em><b></b></div></div>
</main>
<footer><div class="wrap"><p>&copy; {{year}} {{company_name}}</p></div></footer>
</body>
</html>
