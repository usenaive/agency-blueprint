<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --paper: #fbfaf4; --ink: #17201b; --muted: #536058; --grid: #e2e5d8; --head: #eef1e6; --green: #17784a; --red: #b3261e; --rn: 44px; --gut: clamp(16px, 3vw, 48px); --ease: cubic-bezier(0.2, 0.8, 0.2, 1); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.55 "Fraunces", Georgia, serif; -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
.skip { position: absolute; left: 12px; top: -80px; padding: 10px 14px; background: var(--ink); color: var(--paper); }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: var(--gut); }
.mono { font: 400 0.8125rem/1.45 "DM Mono", ui-monospace, monospace; }
header { background: var(--head); border-bottom: 1px solid var(--grid); }
header .wrap { display: flex; align-items: center; min-height: 72px; }
.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 1.25rem; text-decoration: none; overflow-wrap: anywhere; }
.brand i { flex: none; padding: 3px 7px; border: 2px solid var(--green); color: var(--green); font: 500 0.75rem/1 "DM Mono", monospace; transition: transform 0.4s var(--ease); }
main { flex: 1; padding-block: clamp(32px, 5vw, 72px); }
.fx { display: grid; grid-template-columns: var(--rn) 40px minmax(0, 1fr); border: 1px solid var(--grid); background: #fff; }
.fx span { padding: 9px 10px; overflow-wrap: anywhere; }
.fx span + span { border-left: 1px solid var(--grid); }
.fx .err { color: var(--red); }
.cell { position: relative; margin-top: 44px; padding: 18px 16px 22px; border: 2px solid var(--red); background: rgb(179 38 30 / 0.04);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 44px; }
.cell::before { content: ""; position: absolute; left: -1px; top: -1px; border: 9px solid transparent; border-left-color: var(--red); border-top-color: var(--red); }
h1 { font-weight: 360; font-size: clamp(3rem, 0.6rem + 6.6vw, 8rem); line-height: 0.96; letter-spacing: -0.035em; font-variation-settings: "opsz" 144, "SOFT" 30; }
h1 span { color: var(--red); font-family: "DM Mono", monospace; font-size: 0.5em; letter-spacing: 0; vertical-align: 0.4em; }
.lede { margin-top: 28px; max-width: 32em; font-size: 1.1875rem; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 12px; margin-top: 28px; padding: 13px 20px; background: var(--green); color: #fff; font: 500 0.9375rem/1 "DM Mono", monospace; text-decoration: none; box-shadow: 4px 4px 0 var(--ink); transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease); }
footer { background: var(--head); border-top: 1px solid var(--grid); }
footer p { padding-block: 22px; overflow-wrap: anywhere; }
@media (hover: hover) { .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); } .brand:hover i { transform: translate(-2px, -2px); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap"><a class="brand" href="/"><i aria-hidden="true">A1</i>{{company_name}}</a></div></header>
<main id="main" class="wrap">
  <div class="fx mono" aria-hidden="true"><span>B2</span><span>fx</span><span class="err">=PAGE(this_link)</span></div>
  <div class="cell">
    <p class="mono">Error in cell B2</p>
    <h1>This page is not on the sheet <span>#REF!</span></h1>
  </div>
  <p class="lede">The link points at a page that is not in the plan any more. It may be old, or the page may have moved.</p>
  <a class="btn" href="/">Back to the home page</a>
</main>
<footer><div class="wrap"><p class="mono">&copy; {{year}} {{company_name}}</p></div></footer>
</body>
</html>
