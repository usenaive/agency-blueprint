<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --ground: #f6f6f3; --ink: #10131c; --muted: #4c5262; --a: #0e766d; --aBg: #dff0ed; --aInk: #0a332f; --bBg: #ef5a3c; --bInk: #1c0905; --gut: clamp(20px, 4vw, 64px); --ease: cubic-bezier(0.2, 0.8, 0.2, 1); }
@media (prefers-color-scheme: dark) { :root { --ground: #0f1116; --ink: #eceef2; --muted: #a2a8b6; --a: #4fd1c2; --aBg: #0f2a28; --aInk: #d6f3ef; } }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font: 400 1.0625rem/1.6 "Sora", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--a); outline-offset: 3px; }
.skip { position: absolute; left: 12px; top: -80px; padding: 10px 14px; background: var(--ink); color: var(--ground); }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: var(--gut); }
header { display: flex; align-items: center; min-height: 80px; }
.brand { font-weight: 700; text-decoration: none; overflow-wrap: anywhere; display: inline-block; transition: transform 0.35s var(--ease); }
main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }
.half { display: flex; flex-direction: column; justify-content: center; padding: clamp(40px, 6vw, 96px) var(--gut); }
.a { background: var(--aBg); color: var(--aInk); }
.b { background: var(--bBg); color: var(--bInk); }
.tag { align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.a .tag { background: var(--a); color: var(--ground); }
.b .tag { background: var(--bInk); color: var(--bBg); }
h1 { margin-top: 20px; font: 400 clamp(2.75rem, 1rem + 4.6vw, 6rem)/0.95 "DM Serif Display", Georgia, serif; }
.b .big { margin-top: 20px; font-weight: 800; font-size: clamp(2.5rem, 1rem + 4.2vw, 5.5rem); line-height: 0.92; letter-spacing: -0.055em; }
.lede { margin-top: 22px; max-width: 26em; }
.btn { align-self: flex-start; display: inline-flex; gap: 12px; margin-top: 28px; padding: 15px 24px; border-radius: 999px; background: var(--a); color: var(--ground); font-weight: 700; text-decoration: none; transition: transform 0.35s var(--ease); }
.btn b { transition: transform 0.35s var(--ease); }
footer p { padding-block: 24px; font-weight: 600; font-size: 0.9375rem; overflow-wrap: anywhere; }
@media (hover: hover) { .btn:hover { transform: translateY(-3px); } .btn:hover b { transform: translateX(5px); } .brand:hover { transform: translateX(4px); } }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="wrap"><a class="brand" href="/">{{company_name}}</a></header>
<main id="main">
  <div class="half a">
    <p class="tag">Variant A</p>
    <h1>This page does not exist</h1>
    <p class="lede">The link may be old, or the page may have moved.</p>
    <a class="btn" href="/"><span>Back to the home page</span><b aria-hidden="true">→</b></a>
  </div>
  <div class="half b" aria-hidden="true">
    <p class="tag">Variant B</p>
    <p class="big">Still a 404.</p>
    <p class="lede">We tested both. Neither version of this page was found.</p>
  </div>
</main>
<footer class="wrap"><p>&copy; {{year}} {{company_name}}</p></footer>
</body>
</html>
