<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--host-head-->
<title>Page not found | {{company_name}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --ground: #f2f0eb; --paper: #fff; --ink: #111114; --muted: #55555c; --line: #dcd9d2; --blue: #3a2cf5; --blueInk: #3a2cf5; --c1: #c8f04a; --c2: #ffb3dc; --c4: #ff6b2c; --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --gut: clamp(20px, 4vw, 64px); }
@media (prefers-color-scheme: dark) { :root { --ground: #0d0d10; --paper: #18181d; --ink: #f2f0eb; --muted: #a6a6b0; --line: #2b2b33; --blueInk: #9d94ff; } }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font: 400 1.0625rem/1.55 "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--blueInk); outline-offset: 3px; border-radius: 4px; }
.skip { position: absolute; left: 12px; top: -80px; padding: 10px 14px; background: var(--ink); color: var(--ground); border-radius: 8px; }
.skip:focus { top: 12px; }
.wrap { width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: var(--gut); }
header { display: flex; align-items: center; min-height: 80px; }
.brand { display: inline-flex; align-items: center; gap: 10px; padding-block: 6px; font-weight: 800; font-size: 1.125rem; text-decoration: none; overflow-wrap: anywhere; }
.brand i { flex: none; width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--c1) 0 25%, var(--c2) 0 50%, var(--c4) 0 75%, var(--blue) 0); transition: transform 0.6s var(--ease); }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 48px clamp(40px, 6vw, 112px); align-items: center; padding-block: clamp(40px, 7vw, 104px); }
.mono { font: 400 0.8125rem/1.4 "Fragment Mono", ui-monospace, monospace; color: var(--muted); }
h1 { margin-top: 18px; max-width: 10em; font-weight: 850; font-size: clamp(2.75rem, 1rem + 5.4vw, 6.5rem); line-height: 0.94; letter-spacing: -0.045em; }
.lede { margin-top: 24px; max-width: 30em; color: var(--muted); font-size: 1.1875rem; }
.btn { display: inline-flex; align-items: center; gap: 14px; margin-top: 32px; padding: 15px 22px 15px 26px; border-radius: 999px; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none; transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease); }
.btn b { transition: transform 0.35s var(--ease); }
.end { padding: 12px; border-radius: 22px; background: var(--paper); border: 1px solid var(--line); }
.end__art { display: grid; place-items: center; aspect-ratio: 4 / 4.6; border-radius: 12px; border: 2px dashed var(--line); text-align: center; padding: 24px; }
.end__art b { display: block; font-size: 4rem; line-height: 1; letter-spacing: -0.05em; }
.end p.mono { padding: 12px 4px 2px; }
footer { padding-block: 28px; font-weight: 600; font-size: 0.9375rem; }
footer p { overflow-wrap: anywhere; }
@media (hover: hover) { .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 0 -2px var(--c1); } .btn:hover b { transform: translateX(5px); } .brand:hover i { transform: rotate(180deg); } }
@media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } .end { max-width: 340px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="wrap"><a class="brand" href="/"><i aria-hidden="true"></i>{{company_name}}</a></header>
<main id="main" class="wrap">
  <div>
    <p class="mono">Error 404</p>
    <h1>You scrolled past the end</h1>
    <p class="lede">This page is not in the feed any more. The link may be old, or the page may have moved.</p>
    <a class="btn" href="/"><span>Back to the home page</span><b aria-hidden="true">→</b></a>
  </div>
  <div class="end" aria-hidden="true">
    <div class="end__art"><div><b>404</b><p class="mono">No more posts</p></div></div>
    <p class="mono">You are all caught up</p>
  </div>
</main>
<footer class="wrap"><p>&copy; {{year}} {{company_name}}</p></footer>
</body>
</html>
